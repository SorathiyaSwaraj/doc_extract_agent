# Scrapes the API's /metrics every 15 seconds. The API key is read from a file that
# is never committed (monitoring/api_key), and sent as `Authorization: Bearer <key>`.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: doc-extract
    static_configs:
      - targets: ["api:8000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/api_key
