[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extract-agent"
version = "0.1.0"
description = "Agent that extracts validated, structured data from invoices and other business documents."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "pillow==13.0.0",
    "pydantic==2.14.2",
    "pypdfium2==5.15.0",
    "python-multipart==0.0.34",
    "rapidfuzz==3.14.6",
    "rapidocr==3.10.0",
    "reportlab==5.1.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
doc-extract = "doc_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
